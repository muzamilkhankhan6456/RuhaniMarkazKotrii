<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruhani Markaz Kotri</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f0f2f5;padding:12px}
.header{background:#0b6e4f;color:#fff;padding:18px;border-radius:14px;text-align:center}
.header h1{margin:0;font-size:22px}.header p{margin:5px 0 0;opacity:.9;font-size:13px}
.card{background:#fff;padding:15px;border-radius:14px;margin-top:12px;box-shadow:0 2px 8px #0001}
input,select,button{width:100%;padding:12px;margin-top:8px;border-radius:10px;border:1px solid #ddd;font-size:15px}
button{background:#0b6e4f;color:#fff;border:none;font-weight:bold;cursor:pointer}
.btn2{background:#25D366}.btn3{background:#ff9800}.btn4{background:#2196F3}
.member{display:flex;justify-content:space-between;align-items:center;background:#f8f9fa;padding:10px;border-radius:10px;margin-top:8px}
.badge{background:#e8f5e9;color:#0b6e4f;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.del{background:#ff5252;padding:6px 10px;width:auto;margin:0}
.online{color:#0b6e4f;font-weight:bold;text-align:center;font-size:13px}
.tab{display:flex;gap:8px}.tab button{background:#e0e0e0;color:#000}.tab button.active{background:#0b6e4f;color:#fff}
.hazir{width:auto;padding:8px 14px;margin:0}.present{background:#0b6e4f}.absent{background:#ff5252}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}th,td{border:1px solid #ddd;padding:8px;text-align:center}th{background:#0b6e4f;color:#fff}
</style>
</head>
<body>
<div class="header"><h1>🕌 Ruhani Markaz Kotri</h1><p>Attendance & Record System - Live Database</p></div>
<p class="online" id="status">● Connecting...</p>

<div class="card tab">
<button id="t1" class="active" onclick="showTab(1)">👥 Members</button>
<button id="t2" onclick="showTab(2)">✅ Aaj Ki Hazri</button>
<button id="t3" onclick="showTab(3)">📊 Report</button>
</div>

<div id="tab1">
<div class="card">
<h3 style="margin:0">Naya Member Add Karein</h3>
<input id="name" placeholder="Naam likhein">
<input id="phone" placeholder="Mobile Number">
<select id="city"><option>Kotri</option><option>Hyderabad</option><option>Jamshoro</option><option>Karachi</option><option>Other</option></select>
<button onclick="addMember()">+ Member Add Karein</button>
</div>
<div class="card">
<h3 style="margin:0">Members List (<span id="count">0</span>)</h3>
<input id="search" placeholder="Search karein..." oninput="render()">
<div id="list"></div>
</div>
</div>

<div id="tab2" style="display:none">
<div class="card">
<h3 style="margin:0">Aaj Ki Hazri - <span id="today"></span></h3>
<p style="font-size:13px;color:#666">Present = Green, Absent = Red. Hazri khud save ho jayegi.</p>
<p><b>Present: <span id="pCount">0</span> | Absent: <span id="aCount">0</span></b></p>
<div id="hazriList"></div>
<button class="btn2" onclick="sendWhatsApp()">📱 WhatsApp Par Hazri Bhejo</button>
</div>
</div>

<div id="tab3" style="display:none">
<div class="card">
<h3 style="margin:0">Monthly Report</h3>
<input type="month" id="monthPick" onchange="renderReport()">
<div id="report"></div>
<button class="btn3" onclick="sendReportWhatsApp()">📱 Report WhatsApp Par Bhejo</button>
</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCm6fpmntJmEiP0POM4Xi829CIu8Gni8Pw",
  authDomain: "ruhanimarkazkotri.firebaseapp.com",
  databaseURL: "https://ruhanimarkazkotri-default-rtdb.firebaseio.com/",
  projectId: "ruhanimarkazkotri",
  storageBucket: "ruhanimarkazkotri.firebasestorage.app",
  messagingSenderId: "906148918722",
  appId: "1:906148918722:web:d6c78aff570d9a3f67925b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database().ref("members");
const attRef = firebase.database().ref("attendance");
let all = {}; let att = {};
let todayKey = new Date().toISOString().slice(0,10);
document.getElementById("today").innerText = new Date().toLocaleDateString("en-PK");
document.getElementById("monthPick").value = new Date().toISOString().slice(0,7);
db.on("value", s=>{ all=s.val()||{}; document.getElementById("status").innerText="● Connected - Live Database"; render(); renderHazri(); renderReport(); });
attRef.on("value", s=>{ att=s.val()||{}; renderHazri(); renderReport(); });
function showTab(n){
  document.getElementById("tab1").style.display = n==1?"block":"none";
  document.getElementById("tab2").style.display = n==2?"block":"none";
  document.getElementById("tab3").style.display = n==3?"block":"none";
  ["t1","t2","t3"].forEach((id,i)=> document.getElementById(id).className = (i+1==n?"active":""));
}
function addMember(){
  const name=document.getElementById("name").value.trim();
  const phone=document.getElementById("phone").value.trim();
  const city=document.getElementById("city").value;
  if(!name){alert("Naam likhein");return;}
  db.push({name,phone,city,date:new Date().toLocaleDateString("en-PK")});
  document.getElementById("name").value=""; document.getElementById("phone").value="";
  alert("Member save ho gaya ✅");
}
function delMember(id){ if(confirm("Delete karein?")) db.child(id).remove(); }
function render(){
  const q=document.getElementById("search").value.toLowerCase();
  let html=""; let c=0;
  for(let id in all){ let m=all[id]; if(m.name.toLowerCase().includes(q)){ c++; html+=`<div class="member"><div><b>${m.name}</b><br><small>${m.phone||""} - ${m.city} - ${m.date||""}</small></div><div><span class="badge">Active</span> <button class="del" onclick="delMember('${id}')">X</button></div></div>`; } }
  document.getElementById("count").innerText=c;
  document.getElementById("list").innerHTML=html||"<p style='text-align:center;color:#888'>Abhi koi member nahi</p>";
}
function toggleAtt(id, status){ attRef.child(todayKey).child(id).set(status); }
function renderHazri(){
  let html=""; let p=0,a=0;
  let todayAtt = att[todayKey]||{};
  for(let id in all){ let m=all[id]; let st=todayAtt[id];
    if(st=="P") p++; else if(st=="A") a++;
    html+=`<div class="member"><div><b>${m.name}</b><br><small>${st=="P"?"✅ Present":st=="A"?"❌ Absent":"⏳ Pending"}</small></div><div><button class="hazir present" onclick="toggleAtt('${id}','P')">P</button> <button class="hazir absent" onclick="toggleAtt('${id}','A')">A</button></div></div>`;
  }
  document.getElementById("hazriList").innerHTML=html||"Koi member nahi";
  document.getElementById("pCount").innerText=p; document.getElementById("aCount").innerText=a;
}
function renderReport(){
  let month=document.getElementById("monthPick").value;
  let html="<table><tr><th>Naam</th><th>Present</th><th>Absent</th><th>%</th></tr>";
  for(let id in all){ let m=all[id]; let pres=0, abs=0;
    for(let d in att){ if(d.startsWith(month)){ if(att[d][id]=="P") pres++; if(att[d][id]=="A") abs++; } }
    let total=pres+abs; let per= total?Math.round(pres/total*100):0;
    html+=`<tr><td>${m.name}</td><td>${pres}</td><td>${abs}</td><td>${per}%</td></tr>`;
  }
  html+="</table>";
  document.getElementById("report").innerHTML=html;
}
function sendWhatsApp(){
  let txt="🕌 *Ruhani Markaz Kotri - Hazri*%0A📅 "+new Date().toLocaleDateString("en-PK")+"%0A%0A";
  let todayAtt=att[todayKey]||{};
  for(let id in all){ let s=todayAtt[id]=="P"?"✅ Present":todayAtt[id]=="A"?"❌ Absent":"⏳ -"; txt+= all[id].name+" - "+s+"%0A"; }
  window.open("https://wa.me/?text="+txt);
}
function sendReportWhatsApp(){
  let month=document.getElementById("monthPick").value;
  let txt="🕌 *Ruhani Markaz Kotri - Monthly Report "+month+"*%0A%0A";
  for(let id in all){ let pres=0,abs=0; for(let d in att){ if(d.startsWith(month)){ if(att[d][id]=="P") pres++; if(att[d][id]=="A") abs++; } } txt+= all[id].name+" - P:"+pres+" A:"+abs+"%0A"; }
  window.open("https://wa.me/?text="+txt);
}
</script>
</body>
</html>
